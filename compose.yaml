services:
  api:
    build: .
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --no-access-log
    ports:
      - "8000:8000"
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 20s
      timeout: 4s
      retries: 4
  demo:
    build: .
    ports:
      - "8501:7860"
