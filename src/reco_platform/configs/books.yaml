slug: books
label: Livres
singular: livre
icon: book
adapter: reco_platform.domains.books:GoodbooksAdapter
source:
  label: Goodbooks-10k / Open Library
  url: https://github.com/zygmuntz/goodbooks-10k
min_user: 2
min_item: 2
positive: 3.5
seed: 42
default_model: hybrid
models: [random, popular, tfidf, knn, svd, als, hybrid, semantic, advanced]
parameters:
  factors: 12
  als_iterations: 12
  als_regularization: 0.15
  als_alpha: 12.0
  hybrid_weight: 0.68
  diversity_penalty: 0.1
  warm_popular: [5, 10, 20]
tuning:
  factors: [4, 8, 12, 16]
  hybrid_weight: [0.45, 0.85]
  als_regularization: [0.03, 0.4]
