name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.9'
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --extra serving --extra dev --extra experiments --extra docs
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync python -m pytest -q
      - run: uv run --no-sync mkdocs build --strict
      - run: uv build --no-sources
      - run: uv run --no-sync python scripts/deploy_space.py --dry-run
      - name: Vérifier le démarrage Streamlit Community Cloud
        if: matrix.python == '3.12'
        env:
          RECO_EXTERNAL_CATALOGS: '0'
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          uv pip install --no-deps -r app/requirements.txt
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/.venv/bin/python" - <<'PY'
          from os import environ
          from pathlib import Path

          from api import runtime
          from reco_platform import service
          from streamlit.testing.v1 import AppTest

          root = Path(environ["GITHUB_WORKSPACE"]).resolve()
          assert Path(service.__file__).resolve() == root / "src/reco_platform/service.py"
          assert Path(runtime.__file__).resolve() == root / "api/runtime.py"
          app = AppTest.from_file(str(root / "app/streamlit_app.py")).run(timeout=20)
          assert not app.exception, app.exception
          PY
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t prisme:test .
      - run: |
          docker run -d --name prisme-ci -p 127.0.0.1:8000:8000 prisme:test \
            uvicorn api.main:app --host 0.0.0.0 --port 8000
          curl --retry 12 --retry-all-errors --retry-delay 1 --fail http://localhost:8000/health
      - run: |
          docker run -d --name prisme-ci-demo -p 127.0.0.1:7860:7860 prisme:test
          curl --retry 12 --retry-all-errors --retry-delay 1 --fail http://localhost:7860/_stcore/health
      - if: failure()
        run: |
          docker logs prisme-ci 2>/dev/null || true
          docker logs prisme-ci-demo 2>/dev/null || true
      - if: always()
        run: docker rm -f prisme-ci prisme-ci-demo || true
