name: Déployer la démo sur Hugging Face
on:
  workflow_dispatch:
    inputs:
      space_id:
        description: Space Docker au format COMPTE/NOM
        required: true
        type: string
      create_space:
        description: Créer le Space public sur CPU Basic si nécessaire
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: space-${{ inputs.space_id }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install huggingface-hub==0.36.2
      - name: Récupérer la version fusionnée sur main
        run: git fetch --no-tags --depth=1 origin main
      - name: Publier la version fusionnée
        run: python scripts/deploy_space.py --revision FETCH_HEAD
        env:
          HF_SPACE_ID: ${{ inputs.space_id }}
          HF_CREATE_SPACE: ${{ inputs.create_space }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
