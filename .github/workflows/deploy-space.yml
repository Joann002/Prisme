name: Déployer la démo sur Hugging Face
on:
  workflow_dispatch:
    inputs:
      space_id:
        description: Space Docker existant au format COMPTE/NOM
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: space-${{ inputs.space_id }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install huggingface-hub==0.36.2
      - name: Publier les fichiers de la révision
        run: python scripts/deploy_space.py --revision "$GITHUB_SHA"
        env:
          HF_SPACE_ID: ${{ inputs.space_id }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
